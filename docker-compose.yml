services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL is intentionally left unset so the frontend calls
      # same-origin /api/* paths, proxied server-side to the backend below.
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
